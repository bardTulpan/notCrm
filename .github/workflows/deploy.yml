name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  SSH_HOST: 213.139.209.132
  SSH_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: ./mvnw -q -B test

      - name: Build backend
        working-directory: backend
        run: ./mvnw -q -B -DskipTests package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Server's SSH host public key, pinned here to prevent MITM (host keys are public,
          # not secret — this is not a credential, just an identity fingerprint).
          echo "$SSH_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINDNlWZUI9isGY3I+n1K2oiGZ5JXgD1G4eezDLYnma+3" > ~/.ssh/known_hosts

      - name: Upload build artifacts
        run: |
          RELEASE_ID="${{ github.sha }}-$(date +%s)"
          BACKEND_JAR=$(ls backend/target/*.jar | grep -v original | head -1)
          scp -i ~/.ssh/deploy_key "$BACKEND_JAR" "$SSH_USER@$SSH_HOST:/opt/pipeline-crm/releases/crm-${RELEASE_ID}.jar"
          scp -i ~/.ssh/deploy_key -r frontend/dist "$SSH_USER@$SSH_HOST:/opt/pipeline-crm/frontend/releases/dist-${RELEASE_ID}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Activate release, restart, and roll back on failure
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -e

            # Remember what was live before this deploy, so a failed health check
            # can revert to it. This only ever swaps which application code/static
            # files are active — it never touches the database.
            PREV_JAR=\$(readlink -f /opt/pipeline-crm/current.jar 2>/dev/null || true)
            PREV_FRONTEND=\$(readlink -f /opt/pipeline-crm/frontend/current 2>/dev/null || true)

            ln -sfn /opt/pipeline-crm/releases/crm-${RELEASE_ID}.jar /opt/pipeline-crm/current.jar
            ln -sfn /opt/pipeline-crm/frontend/releases/dist-${RELEASE_ID} /opt/pipeline-crm/frontend/current
            sudo systemctl restart pipeline-crm

            for i in \$(seq 1 15); do
              sleep 2
              if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "Backend healthy on new release"
                exit 0
              fi
            done

            echo "New release failed to become healthy — rolling back" >&2
            if [ -n "\$PREV_JAR" ] && [ -f "\$PREV_JAR" ]; then
              ln -sfn "\$PREV_JAR" /opt/pipeline-crm/current.jar
              [ -n "\$PREV_FRONTEND" ] && ln -sfn "\$PREV_FRONTEND" /opt/pipeline-crm/frontend/current
              sudo systemctl restart pipeline-crm
              sleep 5
              if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "Rolled back to previous release successfully" >&2
              else
                echo "Rollback also failed to come up healthy — needs manual attention" >&2
              fi
            else
              echo "No previous release found to roll back to" >&2
            fi
            exit 1
          EOF

      - name: Prune old releases (keep last 5)
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            cd /opt/pipeline-crm/releases && ls -t crm-*.jar | tail -n +6 | xargs -r rm -f
            cd /opt/pipeline-crm/frontend/releases && ls -td dist-* | tail -n +6 | xargs -r rm -rf
          '

      - name: Verify deployment externally
        run: |
          sleep 3
          curl -sf "https://$(ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'journalctl -u cloudflared-quicktunnel --no-pager -n 40 | grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" | tail -1' | sed 's#https://##')/api/v1/health"
