services:
  postgres:
    image: postgres:16
    container_name: pipeline-crm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_crm}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_pass}
    ports:
      # Bound to loopback only — Postgres must never be reachable from the network,
      # let alone the public internet. Only the backend (also on this host) talks to it.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline_user} -d ${POSTGRES_DB:-pipeline_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
