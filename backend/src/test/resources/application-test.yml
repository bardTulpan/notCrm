spring:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: test_secret_key_at_least_32_bytes_long_for_hs256_signing
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    cookie-secure: false
  cors:
    allowed-origin: http://localhost:5173
  # No requests to Telegram from tests; AvatarIntegrationTest turns this on against a local stub.
  avatars:
    enabled: false
    refresh-cron: "-"
