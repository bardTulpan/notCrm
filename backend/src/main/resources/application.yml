server:
  port: 8080

spring:
  application:
    name: pipeline-crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipeline_crm}
    username: ${DB_USERNAME:pipeline_user}
    password: ${DB_PASSWORD:pipeline_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change_me_super_secret_key_at_least_32_bytes_long}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
